name: publish

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to retry (for example v2.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      completed: ${{ steps.release.outputs.completed }}
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Check out existing tag for recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable v<version> tag" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install isolated release dependency without lifecycle scripts
        run: |
          npm install --prefix "$RUNNER_TEMP/release-tools" --ignore-scripts --no-audit --no-fund --package-lock=false semver@7.6.3
          echo "NODE_PATH=$RUNNER_TEMP/release-tools/node_modules" >> "$GITHUB_ENV"
      - name: Create immutable version tag at the release merge commit
        if: github.event_name == 'pull_request'
        env:
          BUMP_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.cjs tag
      - name: Validate tag and generate accumulated release notes
        id: release
        env:
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          export RELEASE_TAG="${RETRY_TAG:-v$(node -p "require('./package.json').version")}"
          node scripts/release.cjs notes
      - name: Record validated source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.completed != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install release npm version
        run: npm install --global npm@11.6.2 --ignore-scripts
      - run: npm ci
      - name: Build, test, and package the tagged commit
        run: |
          npm run check-formatting
          npm run check-formatting:release
          npm run lint
          npm run typecheck
          npm run build
          npm run test:once -- --runInBand
          npm run test:release
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: packed/*.tgz
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install release npm version without lifecycle scripts
        run: npm install --global npm@11.6.2 --ignore-scripts
      - name: Install isolated release dependency without lifecycle scripts
        run: |
          npm install --prefix "$RUNNER_TEMP/release-tools" --ignore-scripts --no-audit --no-fund --package-lock=false semver@7.6.3
          echo "NODE_PATH=$RUNNER_TEMP/release-tools/node_modules" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: packed
      - name: Validate tag and generate accumulated release notes
        id: release
        run: node scripts/release.cjs notes
      - name: Upload draft artifact, publish to npm using OIDC, then finalize GitHub
        if: steps.release.outputs.completed != 'true'
        run: |
          # npm provenance reads these variables for the checked-out source.
          # Preserve the workflow identity while recording the tag on manual retries.
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF="refs/tags/$RELEASE_TAG" node scripts/publish.cjs
